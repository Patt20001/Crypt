<!DOCTYPE html>

</head>
<body>
  <div class="nav glass">
    <div class="brand"><div class="brand-logo">₮</div><span>Nova<span class="brand-accent">Wallet</span></span></div>
    <div class="nav-links">
      <a href="/dashboard.html" class="nav-link">Dashboard</a>

  <div class="container">
    <h2>Copy Trading</h2>
    <p class="tag" style="margin-bottom: 20px;">Follow top traders. Their positions mirror into your account automatically.</p>

      <div class="modal-head">
        <h3 id="follow-title">Follow Trader</h3>
        <button class="modal-close" onclick="closeModal('follow-modal')">×</button>
