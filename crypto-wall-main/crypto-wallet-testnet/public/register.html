<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Register — NovaWallet</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center">
    <div class="card auth-card">
      <div class="brand" style="margin-bottom: 24px;">
        <div class="brand-logo">₮</div>
        <span style="font-size: 18px;">Nova<span class="brand-accent">Wallet</span></span>
      </div>
      <div class="auth-title">Create account</div>
      <div class="auth-sub">Start using USDT in seconds</div>

      <div id="msg"></div>

      <label>Username</label>
      <input id="username" placeholder="satoshi" />

      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label>Password</label>
      <input id="password" type="password" placeholder="min 6 characters" />

      <label>Referral code (optional)</label>
      <input id="referral" placeholder="NVWXXXXXX" style="text-transform: uppercase;" />

      <label style="display:flex; align-items:flex-start; gap: 10px; margin-bottom: 14px;">
        <input type="checkbox" id="terms" style="width:auto; margin-top: 3px;" />
        <span class="tag" style="line-height:1.5;">
          I agree to the <a href="/terms.html" target="_blank">Terms of Service</a>,
          <a href="/privacy.html" target="_blank">Privacy Policy</a>, and
          <a href="/risk.html" target="_blank">Risk Disclosure</a>.
          I understand this is a demo platform.
        </span>
      </label>

      <button style="width:100%" onclick="register()">Sign Up</button>

      <p style="margin-top: 18px; font-size: 13px; color: var(--text-dim); text-align: center;">
        Already have an account? <a href="/login.html">Login</a>
      </p>
    </div>
  </div>
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
