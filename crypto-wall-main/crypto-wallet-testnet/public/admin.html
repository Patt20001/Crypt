<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — NovaWallet</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
 <div class="nav glass">
  <div class="brand">
    <div class="brand-logo">₮</div>
    <span>Nova<span class="brand-accent">Wallet</span></span>
  </div>
  <div class="nav-links">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/staking.html" class="nav-link">Stake</a>
    <a href="/swap.html" class="nav-link">Swap</a>
    <a href="/wallet.html" class="nav-link">Wallet</a>
    <a href="/networks.html" class="nav-link">Networks</a>
    <a href="/profile.html" class="nav-link">Profile</a>
    <div class="theme-toggle" data-action="toggle-theme" title="Toggle theme">🌓</div>
    <a href="#" data-action="logout" class="nav-link">Logout</a>
  </div>
</div>

  <div class="container">
    <h2>Admin Dashboard</h2>

    <div class="grid grid-3" id="stats">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <div class="card">
      <h3>Pending Transactions</h3>
      <button class="secondary sm" onclick="refreshAll()">Refresh</button>
      <div id="pending" style="margin-top:16px;"></div>
    </div>

    <div class="card">
      <h3>Broadcast Banner</h3>
      <label>Message shown to all users</label>
      <input id="banner-msg" placeholder="e.g. Scheduled maintenance at 20:00 UTC" />
      <label style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <input type="checkbox" id="banner-active" style="width:auto; margin:0;" />
        <span style="font-size:13px; color: var(--text-dim);">Activate banner</span>
      </label>
      <button onclick="saveBanner()">Publish</button>
      <div class="row" style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);">
  <div>
    <div class="row-label">Maintenance mode</div>
    <div class="row-sub">Blocks all API calls except auth, admin, and settings</div>
  </div>
  <div class="switch" id="maintenance-switch"></div>
</div>
<label style="margin-top: 12px;">Maintenance message</label>
<input id="maintenance-msg" placeholder="We are upgrading. Back in 15 minutes." />
    </div>

    <div class="card">
      <h3>Users</h3>
      <div id="users"></div>
    </div>

    <div class="card">
      <h3>KYC Document Review</h3>
      <div id="kyc-queue"></div>
    </div>

    <div class="card">
      <h3>Active Stakes</h3>
      <div id="stakes"></div>
    </div>

    <div class="card">
      <h3>All Transactions</h3>
      <div id="alltx"></div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/prices.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
