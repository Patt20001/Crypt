<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — NovaWallet</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#060915" />
<meta name="description" content="Sign in to your NovaWallet account." />
<meta property="og:title" content="Login — NovaWallet" />
<meta property="og:description" content="Sign in to your NovaWallet account." />
<meta property="og:type" content="website" />
</head>
<body>
  <div class="center">
    <div class="card auth-card">
      <div class="brand" style="margin-bottom: 24px;">
        <div class="brand-logo">₮</div>
        <span style="font-size: 18px;">Nova<span class="brand-accent">Wallet</span></span>
      </div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to continue to your wallet</div>

      <div id="msg"></div>

      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />

     <div id="twofa-wrap" style="display:none; margin-bottom: 12px;">
  <label>2FA code from authenticator app</label>
  <input id="code" placeholder="123 456" maxlength="7"
    style="text-align:center; font-family: monospace; font-size: 20px; letter-spacing: 6px;" />
  <p class="tag" style="margin-top: -8px;">
    Open Google Authenticator, Authy, or 1Password and enter the current 6-digit code.
  </p>
</div>

      <button style="width:100%" onclick="login()">Sign In</button>

      <p style="margin-top: 12px; font-size: 13px; text-align: center;">
  <a href="#" onclick="openForgotPassword(); return false;" style="color: var(--accent);">Forgot password?</a>
</p>
      <p style="margin-top: 18px; font-size: 13px; color: var(--text-dim); text-align: center;">
        No account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <div class="modal" id="forgot-modal">
  <div class="modal-inner glass" style="max-width: 460px;">
    <div class="modal-head">
      <h3 id="forgot-title">Reset Password</h3>
      <button class="modal-close" onclick="closeModal('forgot-modal')">×</button>
    </div>
    <div id="forgot-body"></div>
  </div>
</div>

  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
<script src="/js/footer.js"></script>
</body>
</html>
